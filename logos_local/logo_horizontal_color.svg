<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <!-- High-Impact Terracotta Primary Gradient -->
    <linearGradient id="terracottaGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E57D5C" />
      <stop offset="100%" stop-color="#D97757" />
    </linearGradient>

    <!-- Sage Accent Gradient -->
    <linearGradient id="sageGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B846D" />
      <stop offset="100%" stop-color="#4A705B" />
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D97757" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Emblem Group (High Visibility & Impact) -->
  <g filter="url(#logoShadow)">
    <circle cx="45" cy="45" r="40" fill="#FCF9F5" stroke="#D97757" stroke-width="3.5" />
    <circle cx="45" cy="45" r="36" fill="none" stroke="#F4E6E1" stroke-width="1.5" />

    <!-- Food Dots -->
    <circle cx="62" cy="32" r="3" fill="#D97757" opacity="0.6" />
    <circle cx="68" cy="26" r="2.2" fill="#4A705B" opacity="0.7" />
    <circle cx="72" cy="36" r="3.5" fill="#E5A93C" opacity="0.6" />
    <circle cx="18" cy="40" r="2.5" fill="#D97757" opacity="0.6" />

    <!-- Leaf / Heart Icon -->
    <path d="M 45 16 C 42 10, 35 10, 35 17 C 35 24, 45 32, 45 32 C 45 32, 55 24, 55 17 C 55 10, 48 10, 45 16 Z" fill="url(#sageGradH)" />

    <!-- Bold 'M' Emblem -->
    <path d="M 21 62 C 21 38, 29 27, 36 27 C 42 27, 44 37, 45 43 C 46 37, 48 27, 54 27 C 61 27, 69 38, 69 62"
          fill="none" stroke="url(#terracottaGradH)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Side Brand Typography (Bold, High-Contrast & Legible) -->
  <text x="102" y="52"
        font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif"
        font-size="40"
        font-weight="800"
        fill="#2D2623"
        letter-spacing="-0.02em">majkatakata</text>

  <text x="104" y="74"
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif"
        font-size="12"
        font-weight="700"
        fill="#6B615B"
        letter-spacing="3.5">BABY-LED WEANING</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Monochrome Background & Border -->
  <circle cx="250" cy="250" r="235" fill="#1C1917" stroke="#383330" stroke-width="5" />
  <circle cx="250" cy="250" r="220" fill="none" stroke="#292524" stroke-width="2.5" />

  <!-- Logo Emblem Group -->
  <g transform="translate(0, 10)">
    <!-- Food Dots -->
    <circle cx="330" cy="180" r="8" fill="#F5BC59" opacity="0.6" />
    <circle cx="365" cy="150" r="6" fill="#F5BC59" opacity="0.6" />
    <circle cx="388" cy="195" r="10" fill="#F5BC59" opacity="0.5" />
    <circle cx="115" cy="230" r="7" fill="#F5BC59" opacity="0.5" />

    <!-- Leaf / Heart Icon above 'M' -->
    <path d="M 250 80
             C 238 60, 215 60, 215 78
             C 215 96, 250 120, 250 120
             C 250 120, 285 96, 285 78
             C 285 60, 262 60, 250 80 Z"
          fill="#81B29A" />

    <!-- High-Impact Bold Letter 'M' -->
    <path d="M 120 295
             C 120 185, 160 130, 200 130
             C 232 130, 243 175, 250 200
             C 257 175, 268 130, 300 130
             C 340 130, 380 185, 380 295"
          fill="none"
          stroke="#F5BC59"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Brand Title Typography -->
  <text x="250" y="398"
        font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif"
        font-size="44"
        font-weight="800"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="-0.02em">majkatakata</text>

  <!-- Subtitle Tagline -->
  <text x="250" y="428"
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif"
        font-size="15"
        font-weight="700"
        fill="#A0948C"
        text-anchor="middle"
        letter-spacing="3.5">BABY-LED WEANING</text>
</svg>

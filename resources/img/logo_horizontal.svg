<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="100%" height="100%">
  <defs>
    <linearGradient id="terracottaGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28666" />
      <stop offset="100%" stop-color="#D97757" />
    </linearGradient>

    <linearGradient id="sageGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B846D" />
      <stop offset="100%" stop-color="#4A705B" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem - Larger & Impactful -->
  <g transform="translate(5, 5) scale(0.30)">
    <circle cx="200" cy="200" r="185" fill="#FCF9F5" stroke="#D97757" stroke-width="8" />

    <!-- Food dots -->
    <circle cx="270" cy="140" r="9" fill="#D97757" opacity="0.45" />
    <circle cx="295" cy="120" r="7" fill="#4A705B" opacity="0.50" />
    <circle cx="310" cy="160" r="11" fill="#E5A93C" opacity="0.40" />
    <circle cx="95" cy="180" r="8" fill="#D97757" opacity="0.40" />

    <!-- Leaf icon -->
    <path d="M 200 60 C 188 42, 170 42, 170 58 C 170 72, 200 92, 200 92 C 200 92, 230 72, 230 58 C 230 42, 212 42, 200 60 Z" fill="url(#sageGradH)" />

    <!-- Letter M - Bolder & Prominent -->
    <path d="M 100 235 C 100 145, 130 100, 162 100 C 188 100, 196 138, 200 155 C 204 138, 212 100, 238 100 C 270 100, 300 145, 300 235"
          fill="none" stroke="url(#terracottaGradH)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Side Brand Typography - Prominent & Legible -->
  <text x="145" y="70"
        font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif"
        font-size="52"
        font-weight="800"
        fill="#2D2623"
        letter-spacing="0.2">majkatakata</text>

  <text x="148" y="102"
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif"
        font-size="16"
        font-weight="700"
        fill="#D97757"
        letter-spacing="3.5">BABY-LED WEANING</text>
</svg>

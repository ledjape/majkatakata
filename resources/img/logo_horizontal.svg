<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="terracottaGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28666" />
      <stop offset="100%" stop-color="#D97757" />
    </linearGradient>

    <linearGradient id="sageGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B846D" />
      <stop offset="100%" stop-color="#4A705B" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(10, 5) scale(0.35)">
    <circle cx="200" cy="200" r="180" fill="#FCF9F5" stroke="#D97757" stroke-width="6" />

    <!-- Food dots -->
    <circle cx="270" cy="140" r="7" fill="#D97757" opacity="0.35" />
    <circle cx="295" cy="120" r="5" fill="#4A705B" opacity="0.40" />
    <circle cx="310" cy="160" r="9" fill="#E5A93C" opacity="0.30" />
    <circle cx="95" cy="180" r="6" fill="#D97757" opacity="0.30" />

    <!-- Leaf icon -->
    <path d="M 200 70 C 190 55, 175 55, 175 68 C 175 80, 200 98, 200 98 C 200 98, 225 80, 225 68 C 225 55, 210 55, 200 70 Z" fill="url(#sageGradH)" />

    <!-- Letter M -->
    <path d="M 105 230 C 105 150, 133 110, 162 110 C 186 110, 195 142, 200 160 C 205 142, 215 110, 239 110 C 268 110, 295 150, 295 230"
          fill="none" stroke="url(#terracottaGradH)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Side Brand Typography -->
  <text x="170" y="88"
        font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif"
        font-size="44"
        font-weight="700"
        fill="#2D2623"
        letter-spacing="0.5">majkatakata</text>

  <text x="172" y="118"
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif"
        font-size="14"
        font-weight="600"
        fill="#6B615B"
        letter-spacing="3">BABY-LED WEANING</text>
</svg>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>majkatakata - Local Logo Preview</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F4EFEA;
      color: #2D2623;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }

    .preview-card {
      background: #FFFFFF;
      padding: 3rem;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(45, 38, 35, 0.08);
      border: 1px solid #EFE6DD;
      text-align: center;
      max-width: 520px;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #D97757;
    }

    p {
      color: #6B615B;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .svg-container {
      width: 320px;
      height: 320px;
      margin: 0 auto 1.5rem;
    }

    .badge-note {
      display: inline-block;
      background: #F9EBE6;
      color: #D97757;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="preview-card">
    <h1>majkatakata Local Logo Preview</h1>
    <p>Incorporating the letter <strong>'M'</strong> outline with a delicate <strong>Baby Finger</strong> touch.</p>

    <div class="svg-container">
      <!-- Embedded SVG -->
      <img src="logo_local.svg" alt="majkatakata SVG Logo" style="width: 100%; height: 100%;" />

    <span class="badge-note">🔒 Local File Only (Ignored by Git)</span>
